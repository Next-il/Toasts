name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Serialised: two pushes landing together would otherwise read the same "latest release" and both
# try to create the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # GITHUB_TOKEN defaults to read-only on repos created since 2023, so creating a release fails
    # with 403 unless this is granted explicitly.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Toasts.slnx -c Release --nologo

      # Lay the output out exactly as it drops into a server, so the zip unpacks over
      # addons/counterstrikesharp with nothing to move by hand.
      - name: Stage release layout
        run: |
          mkdir -p out/gamedata out/shared out/plugins out/workshop
          cp lib/hudmenu.json                     out/gamedata/
          cp -r .build/shared/HudMenu.Toasts.Api  out/shared/
          cp -r .build/plugins/ToastService       out/plugins/
          cp -r .build/plugins/ToastExample       out/plugins/
          cp -r workshop/panorama workshop/addoninfo.txt out/workshop/
          find out -name '*.pdb' -delete

      - name: Verify the layout
        run: |
          set -e
          test -f out/gamedata/hudmenu.json
          test -f out/shared/HudMenu.Toasts.Api/HudMenu.Toasts.Api.dll
          test -f out/plugins/ToastService/ToastService.dll
          test -f out/plugins/ToastService/HudMenu.Shared.dll
          test -f out/plugins/ToastExample/ToastExample.dll
          test -f out/workshop/panorama/layout/custom_game/toasts.xml

          # The API assembly must NOT sit next to a plugin. Two copies means two types, and the
          # capability cast fails at runtime with nothing useful logged.
          if find out/plugins -name 'HudMenu.Toasts.Api.dll' | grep -q .; then
            echo "::error::HudMenu.Toasts.Api.dll was copied into plugins/. It belongs only in shared/ - check Private=\"false\" on the reference."
            exit 1
          fi

          find out -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: cs2-toasts
          path: out/

      # Everything below only on a push to main. PRs build and stop.
      - name: Work out the next version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read the highest existing release rather than using run_number: run_number counts PR
          # runs too, so it would skip numbers. This gives a plain 1, 2, 3.
          latest=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          current=$(echo "${latest}" | grep -oE '[0-9]+$' || echo 0)
          next=$((current + 1))

          echo "previous: ${latest:-none}  next: v${next}"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"

      - name: Package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cd out && zip -qr "../cs2-toasts-${{ steps.version.outputs.tag }}.zip" . -x '*.DS_Store'

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "cs2-toasts-${{ steps.version.outputs.tag }}.zip" \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
