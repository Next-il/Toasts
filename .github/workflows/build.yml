name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Toasts.slnx -c Release --nologo

      # Lay the output out exactly as it drops into a server, so the artifact can be unzipped
      # straight over addons/counterstrikesharp with nothing to move by hand.
      #
      # shared/ is not cosmetic: CounterStrikeSharp loads assemblies from there into the DEFAULT
      # load context, which is what makes every plugin's IToastApi the same type. A build that
      # puts the API DLL anywhere else produces a package where the capability silently returns
      # null.
      - name: Stage release layout
        run: |
          mkdir -p out/gamedata out/shared out/plugins
          cp lib/hudmenu.json                out/gamedata/
          cp -r .build/shared/HudMenu.Toasts.Api  out/shared/
          cp -r .build/plugins/ToastService       out/plugins/
          cp -r .build/plugins/ToastExample       out/plugins/

          # The Panorama source, for whoever builds the addon.
          mkdir -p out/workshop
          cp -r workshop/panorama workshop/addoninfo.txt out/workshop/

          # Symbols are useful in a bug report but not in a deploy.
          find out -name '*.pdb' -delete

      - name: Verify the layout
        run: |
          set -e
          test -f out/gamedata/hudmenu.json
          test -f out/shared/HudMenu.Toasts.Api/HudMenu.Toasts.Api.dll
          test -f out/plugins/ToastService/ToastService.dll
          test -f out/plugins/ToastService/HudMenu.Shared.dll
          test -f out/plugins/ToastExample/ToastExample.dll
          test -f out/workshop/panorama/layout/custom_game/toasts.xml

          # The API assembly must NOT be copied next to a plugin. Two copies means two types, and
          # the capability cast fails at runtime with nothing useful logged - the exact bug this
          # whole shared/ arrangement exists to prevent.
          if find out/plugins -name 'HudMenu.Toasts.Api.dll' | grep -q .; then
            echo "::error::HudMenu.Toasts.Api.dll was copied into plugins/. It must only exist in shared/ - check Private=\"false\" on the ProjectReference."
            exit 1
          fi

          echo "Release layout OK"
          find out -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: cs2-toasts
          path: out/

      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd out && zip -r ../cs2-toasts-${{ github.ref_name }}.zip . -x '*.DS_Store'

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: cs2-toasts-${{ github.ref_name }}.zip
          body: |
            Unzip over `game/csgo/addons/counterstrikesharp/`.

            `shared/HudMenu.Toasts.Api/` must land in `shared/` - the capability returns null if that
            DLL ends up anywhere else.

            `workshop/` is the Panorama source; build it as an addon and mount it. See the README.
